<form method="post" class="hd-form" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
  {% endif %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">{{ submit_label|default:'Save' }}</button>
  <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
</form>

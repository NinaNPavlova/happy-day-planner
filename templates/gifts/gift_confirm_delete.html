{% extends 'base.html' %}
{% block title %}Delete gift | Happy Day Planner{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 560px;">
  <h1 class="h4">Delete "{{ gift.gift }}"?</h1>
  <p class="text-muted">This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'gifts:detail' gift.pk %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}

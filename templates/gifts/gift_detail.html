{% extends 'base.html' %}
{% block title %}{{ gift.gift }} | Happy Day Planner{% endblock %}
{% block content %}
<div class="card p-4">
  <h1 class="h3">{{ gift.gift }}</h1>
  <p class="text-muted">For: <a href="{% url 'contacts:detail' gift.person.pk %}">{{ gift.person }}</a></p>
  <div class="mt-2">
    <a href="{% url 'gifts:edit' gift.pk %}" class="btn btn-primary">Edit</a>
    <a href="{% url 'gifts:delete' gift.pk %}" class="btn btn-outline-danger">Delete</a>
    <a href="{% url 'gifts:list' %}" class="btn btn-outline-secondary">Back</a>
  </div>
</div>
{% endblock %}

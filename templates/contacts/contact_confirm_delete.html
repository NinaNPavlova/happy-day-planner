{% extends 'base.html' %}
{% block title %}Delete person | Happy Day Planner{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 560px;">
  <h1 class="h4">Delete {{ person.name }} {{ person.surname }}?</h1>
  <p class="text-muted">This will also delete all of their gifts. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'contacts:detail' person.pk %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
